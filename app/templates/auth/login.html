<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Sistem Analisis Sentimen NBC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --blue-deep: #0d47a1;
        --blue-mid: #1565c0;
        --blue-light: #4e8ef7;
        --text-on-blue: #ffffff;
        --text-primary: #1a2538;
        --text-secondary: #6b7686;
        --border-color: #dbe3f0;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        color: var(--text-primary);
      }

      .login-page {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        background: linear-gradient(160deg, var(--blue-deep) 0%, var(--blue-mid) 55%, var(--blue-light) 100%);
        overflow: hidden;
      }

      /* Top brand bar */
      .brand-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px clamp(20px, 5vw, 64px);
        z-index: 5;
      }

      .brand-bar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-on-blue);
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .brand-bar .brand img {
        width: 32px;
        height: 32px;
        object-fit: contain;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.15);
        padding: 4px;
      }

      /* Left hero copy */
      .hero {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        padding: 0 clamp(20px, 6vw, 80px);
        z-index: 2;
        color: var(--text-on-blue);
      }

      .hero-inner {
        max-width: 480px;
      }

      .hero h1 {
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 14px;
      }

      .hero p {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 0;
      }

      /* Right blob panel holding the form */
      .form-panel {
        flex: 1 1 46%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
      }

      .form-panel::before {
        content: '';
        position: absolute;
        inset: 0 -20% 0 0;
        background: #ffffff;
        border-radius: 45% 0 0 45% / 50% 0 0 50%;
      }

      .login-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 380px;
        padding: 16px 8px;
      }

      .login-card .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--blue-mid);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin: 0 auto 28px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .field-input {
        position: relative;
      }

      .field-input input {
        width: 100%;
        height: 48px;
        padding: 0 44px;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-size: 15px;
        color: var(--text-primary);
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .field-input input:focus {
        outline: none;
        border-color: var(--blue-mid);
        box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
      }

      .field-input i.icon-left {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 15px;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 15px;
        padding: 8px;
        min-width: 44px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle:hover {
        color: var(--blue-mid);
      }

      .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
      }

      .remember-row label {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0;
      }

      .btn-login {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 10px;
        background: var(--blue-mid);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 0.2s ease, transform 0.15s ease;
      }

      .btn-login:hover {
        background: var(--blue-deep);
      }

      .btn-login:active {
        transform: scale(0.98);
      }

      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .login-footer {
        text-align: center;
        margin-top: 22px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .login-footer a {
        color: var(--blue-mid);
        text-decoration: none;
        font-weight: 500;
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      /* Mobile: single column, card centered on blue background */
      @media (max-width: 900px) {
        .login-page {
          flex-direction: column;
        }

        .hero {
          flex: none;
          padding: 100px 24px 32px;
          justify-content: center;
          text-align: center;
        }

        .hero-inner {
          max-width: 100%;
        }

        .form-panel {
          flex: none;
          padding: 32px 20px 48px;
        }

        .form-panel::before {
          inset: -24px 5% 0;
          border-radius: 28px;
        }

        .login-card {
          max-width: 360px;
          padding: 24px 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="brand-bar">
        <div class="brand">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Sistem Analisis Sentimen" />
          <span>Analisis Sentimen NBC</span>
        </div>
      </div>

      <div class="hero">
        <div class="hero-inner">
          <h1>Masuk untuk melanjutkan ke dashboard analisis sentimen.</h1>
          <p>Kelola data, pantau hasil klasifikasi, dan kelola sistem dengan satu akun.</p>
        </div>
      </div>

      <div class="form-panel">
        <div class="login-card">
          <div class="avatar">
            <i class="fas fa-user"></i>
          </div>

          <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
            <div class="field">
              <label for="username">Username</label>
              <div class="field-input">
                <i class="fas fa-user icon-left"></i>
                <input
                  type="text"
                  id="username"
                  name="username"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="field-input">
                <i class="fas fa-lock icon-left"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
                <button type="button" class="password-toggle" id="passwordToggle" aria-label="Tampilkan password">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="remember-row">
              <input type="checkbox" id="rememberMe" name="remember" />
              <label for="rememberMe">Ingat saya selama 30 hari</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
              <span class="btn-text">Masuk</span>
            </button>
          </form>

          <div class="login-footer">
            <a href="#" id="forgotPasswordLink">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Auth Dialog Modal -->
    <div class="modal fade" id="authDialogModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius:20px;overflow:hidden;">
          <div class="modal-body p-4 text-center">
            <div id="authDialogIconWrap" style="width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;">
              <i id="authDialogIconEl" class="fas fa-info-circle"></i>
            </div>
            <h5 class="fw-bold mb-2" id="authDialogTitle"></h5>
            <p class="mb-4" id="authDialogMessage"></p>
            <button type="button" class="btn px-5 py-2 fw-semibold" id="authDialogBtn" style="border-radius:10px;color:#fff;border:none;">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      var AUTH_DIALOG_TYPES = {
        success: { icon: 'fas fa-check-circle', bg: '#e8f5e9', iconColor: '#2e7d32', btnBg: '#2e7d32', title: 'Berhasil!'     },
        danger:  { icon: 'fas fa-times-circle', bg: '#fce4ec', iconColor: '#b71c1c', btnBg: '#b71c1c', title: 'Login Gagal'   },
        error:   { icon: 'fas fa-times-circle', bg: '#fce4ec', iconColor: '#b71c1c', btnBg: '#b71c1c', title: 'Terjadi Kesalahan' },
        warning: { icon: 'fas fa-exclamation-triangle', bg: '#fff8e1', iconColor: '#e65100', btnBg: '#e65100', title: 'Perhatian' },
        info:    { icon: 'fas fa-info-circle', bg: '#e3f2fd', iconColor: '#1565c0', btnBg: '#1565c0', title: 'Informasi'      },
      };

      function showAuthDialog(message, type, onClose) {
        var cfg = AUTH_DIALOG_TYPES[type] || AUTH_DIALOG_TYPES.info;
        document.getElementById('authDialogIconWrap').style.background = cfg.bg;
        var iconEl = document.getElementById('authDialogIconEl');
        iconEl.className = cfg.icon;
        iconEl.style.color = cfg.iconColor;
        document.getElementById('authDialogTitle').textContent = cfg.title;
        document.getElementById('authDialogMessage').textContent = message;
        var btn = document.getElementById('authDialogBtn');
        btn.style.background = cfg.btnBg;
        var modal = new bootstrap.Modal(document.getElementById('authDialogModal'));
        btn.onclick = function () { modal.hide(); if (typeof onClose === 'function') onClose(); };
        modal.show();
      }

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('username').focus();

        const passwordInput = document.getElementById('password');
        document.getElementById('passwordToggle').addEventListener('click', function () {
          const isHidden = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
          this.querySelector('i').className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
          this.setAttribute('aria-label', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
        });

        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        form.addEventListener('submit', function () {
          loginBtn.disabled = true;
          loginBtn.querySelector('.btn-text').innerHTML = '<span class="spinner"></span>Memproses...';
          setTimeout(() => {
            if (loginBtn.disabled) {
              loginBtn.disabled = false;
              loginBtn.querySelector('.btn-text').textContent = 'Masuk';
            }
          }, 5000);
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', function (e) {
          e.preventDefault();
          showAuthDialog('Hubungi administrator untuk melakukan reset password.', 'info');
        });

        {% if success %}
          showAuthDialog('Login berhasil! Mengalihkan ke dashboard...', 'success', function () {
            window.location.href = "{{ url_for('dashboard.index') }}";
          });
          setTimeout(function () {
            window.location.href = "{{ url_for('dashboard.index') }}";
          }, 2500);
        {% else %}
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                showAuthDialog("{{ message | e }}", "{{ category }}");
              {% endfor %}
            {% endif %}
          {% endwith %}
        {% endif %}
      });
    </script>
  </body>
</html>
